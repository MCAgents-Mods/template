plugins {
    // The three loader toolchains are declared once, here, so they load into one shared
    // build classloader instead of one per module.
    alias(libs.plugins.fabric.loom) apply false
    alias(libs.plugins.moddevgradle) apply false
    alias(libs.plugins.forgegradle) apply false
}

allprojects {
    group = 'io.github.mcagentsmods'
    version = providers.gradleProperty('project-version').get()
}

subprojects {
    // MCAgents core's published jars, for a build with no core checkout beside it: the
    // Publish workflow, or a machine that only builds the mod. GitHub Packages asks for a
    // token even to read a public package, so the credentials are the same pair publishing
    // reads. Only core's group is looked up here; with a checkout beside the mod,
    // settings.gradle substitutes it and this repository is never asked.
    repositories {
        maven {
            name = 'MCAgentsCore'
            url = 'https://maven.pkg.github.com/MCAgents-Mods/core'
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
            content {
                includeGroup 'io.github.mcagentsmods'
            }
        }
    }

    // Every library module publishes under its project name, which settings.gradle sets to
    // template-{module}: the group alone cannot tell this mod's api from core's.
    // The loader modules publish nothing; their jars go to the GitHub release instead.
    // The jar each module builds is named by its own archivesName, MCAgentsTemplate{Module}.
    apply plugin: 'maven-publish'

    publishing {
        repositories {
            maven {
                name = 'GitHubPackages'
                url = "https://maven.pkg.github.com/${providers.gradleProperty('git-org').get()}/${providers.gradleProperty('git-repo').get()}"
                credentials {
                    username = System.getenv('GITHUB_ACTOR')
                    password = System.getenv('GITHUB_TOKEN')
                }
            }
        }
    }
}
