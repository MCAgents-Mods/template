# Platform coordinates for the mod.
#
# gradle.properties carries the project's identity only (organization, repository,
# version). Everything that pins a dependency lives here.
#
# Check each loader's own maven before moving Minecraft: Fabric (meta.fabricmc.net),
# NeoForge (maven.neoforged.net) and Forge (maven.minecraftforge.net) must all publish a
# build for it. Minecraft 26.x ships unobfuscated, so no module declares a mappings
# coordinate. Keep these in step with MCAgents core's own catalog: a mod built for a
# different Minecraft than core's cannot load beside it. The pack formats in the Forge
# version folder's pack.mcmeta (platforms/forge/{version}/) move with Minecraft: copy them from that
# Forge build's own pack.mcmeta.

[versions]
java = "25"
fabric-loader = "0.19.5"
fabric-loom = "1.18.4"
moddevgradle = "2.0.148"
forgegradle = "7.0.40"
junit = "6.1.3"
# The block for the one Minecraft version this mod supports, the latest release, each entry
# suffixed with the version (26.3 -> -26-3). Every Minecraft-facing module has a subproject
# for it, platforms/{module}/{version}, which finds its entries by that suffix; the version
# itself is listed in settings.gradle. Moving to a new release replaces this block, that
# entry and each module's version folder; the old version is not kept.
minecraft-26-3 = "26.3"
fabric-api-26-3 = "0.162.0+26.3"
neoforge-26-3 = "26.3.0.76"
forge-26-3 = "26.3-66.0.11"
# MCAgents core. Compiled against, never bundled: the mcagents_core mod provides it in game.
mcagents-core = "0.11.0"

[libraries]
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
minecraft-26-3 = { module = "com.mojang:minecraft", version.ref = "minecraft-26-3" }
fabric-api-26-3 = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api-26-3" }
core-api = { module = "io.github.mcagentsmods:core-api", version.ref = "mcagents-core" }
core-common = { module = "io.github.mcagentsmods:core-common", version.ref = "mcagents-core" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabric-loom" }
moddevgradle = { id = "net.neoforged.moddev", version.ref = "moddevgradle" }
forgegradle = { id = "net.minecraftforge.gradle", version.ref = "forgegradle" }
