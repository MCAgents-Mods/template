// The Forge mod jar: the entry point, which finds the game directory on the client, plus
// everything platforms/shared and the modules below it carry.
//
// This is the only module that may reference Forge types. Start-up lives in
// platforms/shared, the logic in common/ — see .agents/rules/repository.md.

// Built for the Minecraft version the mod supports: platforms/forge/{version}/build.gradle
// applies ForgeGradle, then this.

apply from: '../../minecraft.gradle'

base {
    archivesName = 'MCAgentsTemplateForge'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(libs.versions.java.get())
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = libs.versions.java.get() as int
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${versionFor('forge')}")

    implementation project(':template-api')
    implementation project(':template-common')
    implementation project(sharedModule)
}

// api/, common/ and platforms/shared are this mod's own code, so their classes and resources
// are merged into the mod jar rather than nested.
def bundledModules = [
        ':template-api',
        ':template-common',
        sharedModule
]

tasks.named('jar', Jar) {
    bundledModules.each { path ->
        from project(path).sourceSets.main.output
    }

    // The license travels with the jar, renamed so it cannot be mistaken for a dependency's.
    def projectName = project.name
    inputs.property 'projectName', projectName
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${projectName}" }
    }
}

processResources {
    def modVersion = project.version
    // The core this build compiled against is the oldest the jar may run with.
    def coreVersion = libs.versions.mcagents.core.get()
    def minecraft = minecraftVersion
    def next = minecraftNext
    // The loader's major version, which mods.toml ranges are in: 66 from 26.3-66.0.11.
    def forgeMajor = versionFor('forge').tokenize('-')[1].tokenize('.')[0]
    inputs.property 'version', modVersion
    inputs.property 'coreVersion', coreVersion
    inputs.property 'minecraft', minecraft
    inputs.property 'minecraftNext', next
    inputs.property 'forgeMajor', forgeMajor

    filesMatching('META-INF/mods.toml') {
        expand version: modVersion, coreVersion: coreVersion, minecraft: minecraft,
                minecraftNext: next, forgeMajor: forgeMajor
    }
}

// The mod jar is never published to GitHub Packages: the Release workflow attaches it to the
// GitHub release of each version, and only the library modules are published.
