// The NeoForge mod jar: the client entry point, which finds the game directory, plus
// everything platforms/shared and the modules below it carry.
//
// This is the only module that may reference NeoForge types. Start-up lives in
// platforms/shared, the logic in common/ — see .agents/rules/repository.md.

plugins {
    id 'net.neoforged.moddev'
}

// The one Minecraft version this mod supports, the latest release. The catalog's minecraft
// entry is the only place it is named.
def minecraftVersion = libs.versions.minecraft.get()

// The first Minecraft version this one does not cover, for the closed ranges the loader
// metadata declares: 26.3 -> 26.4.
def minecraftNext = minecraftVersion.tokenize('.').with { parts ->
    "${parts[0]}.${(parts[1] as int) + 1}"
}

base {
    archivesName = 'MCAgentsTemplateNeoforge'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(libs.versions.java.get())
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = libs.versions.java.get() as int
}

repositories {
    mavenCentral()
}

neoForge {
    version = libs.versions.neoforge.get()

    mods {
        'mcagents_template' {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // This mod's own modules are part of it: the jar task below merges their classes, and the
    // dev client runs them from this module's class path. This module is never published, so
    // implementation reaches nothing else. Core is not declared here: api/ and common/ compile
    // against it with compileOnlyApi, since the mcagents_core mod provides it in game.
    implementation project(':template-api')
    implementation project(':template-common')
    implementation project(':template-shared')

    // NeoForge itself is not declared here: ModDevGradle compiles against it, and the game
    // provides it at runtime.
}

// api/, common/ and platforms/shared are this mod's own code, so their classes and resources
// are merged into the mod jar rather than nested. A third-party runtime library would be
// nested with jarJar instead.
def bundledModules = [
        ':template-api',
        ':template-common',
        ':template-shared'
]

tasks.named('jar', Jar) {
    // MCAgentsTemplateNeoforge-0.0.0+26.3.jar: the mod's version, then the game's.
    archiveVersion = "${project.version}+${minecraftVersion}"

    bundledModules.each { path ->
        from project(path).sourceSets.main.output
    }

    // The license travels with the jar, renamed so it cannot be mistaken for a dependency's.
    def projectName = project.name
    inputs.property 'projectName', projectName
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${projectName}" }
    }
}

processResources {
    def modVersion = project.version
    // The core this build compiled against is the oldest the jar may run with.
    def coreVersion = libs.versions.mcagents.core.get()
    def minecraft = minecraftVersion
    def next = minecraftNext
    inputs.property 'version', modVersion
    inputs.property 'coreVersion', coreVersion
    inputs.property 'minecraft', minecraft
    inputs.property 'minecraftNext', next

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: modVersion, coreVersion: coreVersion, minecraft: minecraft,
                minecraftNext: next
    }
}

// The mod jar is never published to GitHub Packages: the Release workflow attaches it to the
// GitHub release of each version, and only the library modules are published.
