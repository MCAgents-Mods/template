pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases/'
        }
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    // Downloads a matching JDK when the toolchain the build asks for is not installed.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'template'

// MCAgents core — the model client and the holograms every MCAgents mod runs on. With a
// checkout of MCAgents-Mods/core beside this one (or wherever -Pcore-build points), Gradle
// builds this mod against that source, so a change to core is tested here before it is
// published. Without one, the published core-api and core-common are
// resolved instead.
def coreBuild = file(providers.gradleProperty('core-build').getOrElse('../core'))
if (new File(coreBuild, 'settings.gradle').isFile()) {
    includeBuild(coreBuild) {
        dependencySubstitution {
            substitute module('io.github.mcagentsmods:core-api') using project(':api')
            substitute module('io.github.mcagentsmods:core-common') using project(':common')
        }
    }
}

// Every project is named template-{module}, which is also its artifact id. The
// prefix keeps them apart from core's own :api and :common in the composite build above.
include 'template-api'
project(':template-api').projectDir = file('api')

include 'template-common'
project(':template-common').projectDir = file('common')

// The Minecraft-facing modules: platforms/shared and one per loader, each a single folder
// with its own build.gradle and src/. They build for the one Minecraft version the catalog
// names, so no folder or project carries it.
['shared', 'fabric', 'neoforge', 'forge'].each { module ->
    include "template-${module}"
    project(":template-${module}").projectDir = file("platforms/${module}")
}
