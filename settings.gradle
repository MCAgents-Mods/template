pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases/'
        }
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    // Downloads a matching JDK when the toolchain the build asks for is not installed.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'template'

// The Minecraft version this mod builds for: only ever the latest release, never an older
// one beside it. platforms/shared and each loader compile against Minecraft, so each is a
// folder of shared sources, platforms/{module}/src, with a subproject for the version in
// platforms/{module}/{version}, holding only what is particular to that version. The
// subproject is named mcagents-template-{module}, without the version, which is also its
// published artifact id; the jar's name carries the version. The catalog carries the
// version's block of coordinates. Moving to a new Minecraft release replaces the version
// here, the catalog block and each module's version folder; nothing else names it.
def minecraftVersion = '26.3'

// MCAgents core — the model client and the holograms every MCAgents mod runs on. With a
// checkout of MCAgents-Mods/core beside this one (or wherever -Pcore-build points), Gradle
// builds this mod against that source, so a change to core is tested here before it is
// published. Without one, the published mcagents-core-api and mcagents-core-common are
// resolved instead.
def coreBuild = file(providers.gradleProperty('core-build').getOrElse('../core'))
if (new File(coreBuild, 'settings.gradle').isFile()) {
    includeBuild(coreBuild) {
        dependencySubstitution {
            substitute module('io.github.mcagentsmods:mcagents-core-api') using project(':api')
            substitute module('io.github.mcagentsmods:mcagents-core-common') using project(':common')
        }
    }
}

// Every project is named mcagents-template-{module}, which is also its artifact id. The
// prefix keeps them apart from core's own :api and :common in the composite build above.
include 'mcagents-template-api'
project(':mcagents-template-api').projectDir = file('api')

include 'mcagents-template-common'
project(':mcagents-template-common').projectDir = file('common')

['shared', 'fabric', 'neoforge', 'forge'].each { module ->
    include "mcagents-template-${module}"
    project(":mcagents-template-${module}").projectDir = file("platforms/${module}/${minecraftVersion}")
}
